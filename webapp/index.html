<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFAF2" />
    <title>Damirchi - Telegram Menyusi</title>

    <link rel="preconnect" href="https://damirchi-bobo-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://damirchi-bobo-api.onrender.com" />
    <link rel="preconnect" href="https://i.ibb.co" crossorigin />
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="preconnect" href="https://telegram.org" crossorigin />

    <link
      rel="preload"
      href="https://damirchi-bobo-api.onrender.com/api/menu/"
      as="fetch"
      crossorigin="anonymous"
    />

    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      html, body { margin: 0; background: #f7f3eb; overscroll-behavior-y: contain; }
      #boot-shell {
        min-height: 100vh;
        max-width: 480px;
        margin: 0 auto;
        background: #f7f3eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #241812;
      }
      .boot-header {
        padding: max(54px, env(safe-area-inset-top)) 16px 14px;
        background: #fffaf2;
        border-bottom: 1px solid #eadcc7;
        font-size: 20px;
        font-weight: 900;
      }
      .boot-toggle { margin: 12px 16px; height: 58px; border-radius: 20px; background: #fff; border: 1px solid #eadcc7; }
      .boot-banner { margin: 12px 16px; height: 138px; border-radius: 22px; background: #d9c29b; }
      .boot-line { margin: 16px; width: 42%; height: 22px; border-radius: 8px; background: #e7ddd0; }
      .boot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 90px; }
      .boot-card { height: 230px; border-radius: 20px; background: #fff; border: 1px solid #eadcc7; overflow: hidden; }
      .boot-img { height: 145px; background: #ebe3d8; }
      @media (prefers-reduced-motion: no-preference) {
        .boot-img, .boot-line { animation: bootPulse 1.1s ease-in-out infinite alternate; }
        @keyframes bootPulse { from { opacity: .58; } to { opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" aria-hidden="true">
        <div class="boot-header">Damirchi</div>
        <div class="boot-toggle"></div>
        <div class="boot-banner"></div>
        <div class="boot-line"></div>
        <div class="boot-grid">
          <div class="boot-card"><div class="boot-img"></div></div>
          <div class="boot-card"><div class="boot-img"></div></div>
          <div class="boot-card"><div class="boot-img"></div></div>
          <div class="boot-card"><div class="boot-img"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
