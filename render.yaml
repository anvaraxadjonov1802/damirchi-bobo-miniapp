services:
  - type: web
    name: damirchi-bobo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py ensure_admin && python manage.py configure_telegram_webhook && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/settings/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: damirchi
      - key: ALLOWED_HOSTS
        value: damirchi-bobo-api.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://damirchi.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://damirchi.vercel.app
      - key: WEBAPP_URL
        value: https://damirchi.vercel.app
      - key: BACKEND_PUBLIC_URL
        value: https://damirchi-bobo-api.onrender.com
      - key: PAYMENT_RETURN_URL
        value: https://damirchi.vercel.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OPERATOR_CHAT_ID
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "86400"
      - key: ALLOW_UNVERIFIED_TELEGRAM_IN_DEBUG
        value: "False"

      # Click Business / Shop API. Configure manually in Render Environment.
      - key: CLICK_ENABLED
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false

      # Payme Business / Merchant API. Configure manually in Render Environment.
      - key: PAYME_ENABLED
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_LOGIN
        sync: false
      - key: PAYME_SECRET_KEY
        sync: false
      - key: PAYME_ACCOUNT_FIELD
        value: order_id

      - key: IMGBB_API_KEY
        sync: false
      - key: USE_SUPABASE_STORAGE
        value: "False"
      - key: SUPABASE_STORAGE_BUCKET
        value: damirchi-media
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION_NAME
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_PUBLIC_MEDIA_URL
        sync: false
