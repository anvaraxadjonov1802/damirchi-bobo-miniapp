services:
  - type: web
    name: damirchi-bobo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_damirchi_menu && python manage.py configure_telegram_webhook && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/settings/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: damirchi
      - key: ALLOWED_HOSTS
        value: damirchi-bobo-api.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://damirchi.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://damirchi.vercel.app
      - key: WEBAPP_URL
        value: https://damirchi.vercel.app
      - key: BACKEND_PUBLIC_URL
        value: https://damirchi-bobo-api.onrender.com
      - key: PAYMENT_RETURN_URL
        value: https://damirchi.vercel.app
      - key: BOT_TOKEN
        sync: false
      - key: OPERATOR_CHAT_ID
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "86400"
      - key: ALLOW_UNVERIFIED_TELEGRAM_IN_DEBUG
        value: "False"
      - key: CLICK_ENABLED
        value: "False"
      - key: PAYME_ENABLED
        value: "False"
      - key: PAYME_ACCOUNT_FIELD
        value: order_id
      - key: USE_SUPABASE_STORAGE
        value: "False"
